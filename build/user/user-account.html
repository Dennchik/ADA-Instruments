<!-- ! --------------------------[ TAB - Личный кабинет ] -------------------------- -->
<div class="acccount-section__tab-content inner-content user-account">
	<!-- * -->
	<div class="acccount-content">
		<div class="acccount-content__body">
			<div class="acccount-content__title">
				<!-- * [ BUTTONS ] -->
				<div class="acccount-section__buttons">
					<div class="acccount-section__link-button link-button">
						<div class="vertical-dots" id="verticalDots">
							<span></span>
							<span></span>
							<span></span>
						</div>
					</div>
				</div>
				<!-- * [ / BUTTONS ] -->
				<h2 class="form-user__title font_clamp_50 fw700">Личный кабинет</h2>
			</div>
			<form class="form-user" id="orderForm">
				<div class="form-user__wrapp-group bp-1">
					<!--* ------------------ Line ------------------------- -->
					<div class="form-user__line">
						<!--* ФИО -->
						<div class="form-user__group">
							<label class="form-user__label" for="fullname">ФИО</label>
							<input class="form-user__input" type="text" id="fullname" name="fullname"
								placeholder="Иванов Иван Иванович" value="">
						</div>
						<!--* Дата рождения -->
						<div class="form-user__group">
							<label class="form-user__label text-right" for="birthdate">Дата рождения</label>
							<input class="form-user__input text-right" type="date" id="birthdate" name="birthdate">
						</div>
					</div>
					<!--* ------------------ Line ------------------------- -->
					<!-- * [ FORM ] -->
					<div class="form-user__line">

						<!--* Пол (радиокнопки) -->
						<div class="form-user__group">
							<span class="form-user__label">Пол</span>
							<div class="radio-group">
								<label class="radio-group__item">
									<input class="radio-group__input" type="radio" name="gender" value="male" required>
									<span class="radio-group__label">Мужской</span>
								</label>
								<label class="radio-group__item">
									<input class="radio-group__input" type="radio" name="gender" value="female" required>
									<span class="radio-group__label">Женский</span>
								</label>
							</div>
						</div>

						<!--* Город -->
						<div class="form-user__group">
							<label class="form-user__label text-right" for="city">Город *</label>
							<input class="form-user__input text-right" type="text" id="city" name="city" placeholder="Москва"
								required>
						</div>
					</div>
					<!-- * [ / FORM ] -->
					<!--* ------------------ Line ------------------------- -->
					<div class="form-user__line">
						<!-- Email -->
						<div class="form-user__group">
							<label class="form-user__label" for="email">Email</label>
							<input class="form-user__input" type="email" id="email" name="email" autocomplete="email"
								placeholder="example@mail.ru" required>
						</div>
						<!--* Телефон -->
						<div class="form-user__group">

							<label class="form-user__label text-right" for="phone">Телефон</label>
							<div class="form-user__group">
								<input class="form-user__input text-right mask-phone" type="tel" id="phone" name="phone"
									autocomplete="tel" placeholder="+7 (999) 123-45-67" required="">
							</div>
						</div>
					</div>
					<!--* ------------------ Line ------------------------- -->
					<div class="form-user__line">
						<!-- Адрес доставки -->
						<div class="form-user__group">
							<label class="form-user__label" for="address">Адрес доставки *</label>
							<input class="form-user__input" type="text" id="address" name="address" autocomplete="address"
								placeholder="ул. Пушкина, д. 10, кв. 5" required>
						</div>
					</div>
					<!--* ------------------ Line ------------------------- -->
					<div class="form-user__line">
						<!-- Способ доставки (радиокнопки) -->
						<div class="form-user__group _delivery">
							<span class="form-user__label">Способ доставки</span>
							<div class="radio-group">
								<div class="radio-group__line">
									<label class="radio-group__item">
										<input class="radio-group__input" type="radio" name="delivery" value="cdek" required>
										<span class="radio-group__label">СДЭК</span>
									</label>
									<label class="radio-group__item">
										<input class="radio-group__input" type="radio" name="delivery" value="pvz" required>
										<span class="radio-group__label">ПВЗ</span>
									</label>
								</div>

								<div class="radio-group__line">
									<label class="radio-group__item">
										<input class="radio-group__input" type="radio" name="delivery" value="yandex" required>
										<span class="radio-group__label">Яндекс Доставка</span>
									</label>
									<label class="radio-group__item">
										<input class="radio-group__input" type="radio" name="delivery" value="pochta" required>
										<span class="radio-group__label">Почта России</span>
									</label>
								</div>
							</div>
						</div>
						<!--* Кнопка Сохранить -->
						<div class="form-user__group">
							<button class="form-user__button dark_button" type="submit">Сохранить</button>
						</div>


					</div>
				</div>
			</form>
			<!-- * -->
		</div>
	</div>
